name: Compilar APK de RetroAmp

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar dependencias
        run: npm install

      - name: Crear proyecto Android
        run: |
          rm -rf android
          npx cap add android

      - name: Aplicar código nativo de RetroAmp
        env:
          VERSION_CODE: ${{ github.run_number }}0
        run: bash scripts/patch-android.sh

      - name: Firma fija (permite actualizar sin desinstalar)
        run: |
          mkdir -p ~/.android
          cp signing/debug.keystore ~/.android/debug.keystore

      - name: Sincronizar web con Android
        run: npx cap sync android

      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Renombrar APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk RetroAmp.apk

      - name: Publicar APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: RetroAmp-APK
          path: RetroAmp.apk
